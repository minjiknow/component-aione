<!DOCTYPE html>
<html lang="ko" class="control-preview-root">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>ServiceCard 컴포넌트</title>
	<link rel="icon" href="../../assets/icons/ai-one-logo.svg" type="image/svg+xml" />
	<link rel="stylesheet" href="../_preview/component-base.css?v=20260727" />
	<link rel="stylesheet" href="../button/button.css?v=20260731-3" />
	<link rel="stylesheet" href="../modal/modal.css?v=20260731-2" />
	<link rel="stylesheet" href="service-card.css?v=20260731-3" />
	<link rel="stylesheet" href="../_preview/component-preview.css?v=20260728-7" />
</head>

<body class="control-preview-page">
	<main class="control-preview control-preview-wide">
		<header class="control-preview-header">
			<div>
				<h1 class="control-preview-title">ServiceCard</h1>
				<p class="control-preview-desc">AI-ONE 홈에서 서비스의 아이콘·이름·설명을 표시하고 해당 업무 화면으로 연결하는 카드입니다.</p>
			</div>
			<a class="control-preview-back" href="../index.html#display">컴포넌트 목록</a>
		</header>

		<section class="control-preview-section" aria-labelledby="service-card-state-title">
			<h2 class="control-preview-section-title" id="service-card-state-title">상태</h2>
			<div class="control-use-list">
				<article class="control-use-case">
					<span class="control-use-label">Active</span>
					<ul class="service-cards service-card-detail-list" aria-label="활성 ServiceCard 예제"
						data-service-card-active></ul>
				</article>
			</div>
		</section>
	</main>

	<div data-component-include="modal" data-component-id="preparingServiceModal"
		data-component-variant="alert" data-component-label="준비중 안내">
		<template data-slot="title">준비중</template>
		<template data-slot="description">해당 서비스는 현재 준비 중입니다.</template>
		<template data-slot="actions">
			<button type="button" class="btn-confirm" data-modal-close>확인</button>
		</template>
	</div>

	<script src="../component-include-loader.js?v=20260731-7"></script>
	<script src="service-card.js?v=20260731-3"></script>
	<script>
		window.AIOneServiceCard.renderList('[data-service-card-active]', [
			{
				href: '../../pages/ai-workspace.html',
				icon: '../../assets/icons/service-question-classification.svg',
				iconTone: 'blue',
				title: '국회 질의 분류',
				description: '질의 업로드 · OCR/파싱 · 질의 분류 · 추천실국 확인'
			},
			{
				href: '../../pages/ai-answer.html',
				icon: '../../assets/icons/service-answer-draft.svg',
				iconTone: 'green',
				title: '국회 답변서 초안 생성',
				description: '자료 분석 · 유사답변서 추천 · 초안 생성 · 편집'
			},
			{
				icon: '../../assets/icons/service-economic-trends.svg',
				iconTone: 'orange',
				title: '경제동향 분석 보고서',
				description: '데이터 수집 · 동향 분석 · 보고서 초안 · 검토',
				status: 'preparing'
			},
			{
				icon: '../../assets/icons/service-chatbot.svg',
				iconTone: 'purple',
				title: '세수예측 및 시나리오 시뮬레이션',
				description: '시나리오별 세수 예측',
				status: 'preparing'
			}
		]);
	</script>
</body>

</html>
