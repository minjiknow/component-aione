<!DOCTYPE html>
<html lang="ko" class="control-preview-root">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Filter Button 컴포넌트</title>
	<link rel="icon" href="../../assets/icons/ai-one-logo.svg" type="image/svg+xml" />
	<link rel="stylesheet" href="../_preview/component-base.css?v=20260727" />
	<link rel="stylesheet" href="../../css/common.css?v=20260727" />
	<link rel="stylesheet" href="../_preview/component-preview.css?v=20260727" />
</head>
<body class="control-preview-page">
	<main class="control-preview">
		<header class="control-preview-header">
			<div>
				<h1 class="control-preview-title">Filter Button</h1>
				<p class="control-preview-desc">목록의 표시 범위를 빠르게 좁힐 때 사용하는 작은 필터 버튼입니다.</p>
			</div>
			<a class="control-preview-back" href="../index.html#actions">컴포넌트 목록</a>
		</header>

		<section class="control-preview-section" aria-labelledby="filter-btn-title">
			<h2 class="control-preview-section-title" id="filter-btn-title">기본형</h2>
			<div class="filter-bar" role="toolbar" aria-label="질의 필터">
				<button type="button" class="filter-btn active" aria-pressed="true" data-filter="all">전체 <span class="filter-count">4</span></button>
				<button type="button" class="filter-btn" aria-pressed="false" data-filter="single">단일소관 <span class="filter-count">2</span></button>
				<button type="button" class="filter-btn" aria-pressed="false" data-filter="multi">복수소관 <span class="filter-count">1</span></button>
				<button type="button" class="filter-btn" aria-pressed="false" data-filter="none">비소관 <span class="filter-count">1</span></button>
			</div>
		</section>
	</main>
	<script src="../../js/common.js?v=20260723"></script>
</body>
</html>
