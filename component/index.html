<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>AI-ONE 컴포넌트 카탈로그</title>
	<link rel="icon" href="../assets/icons/ai-one-logo.svg" type="image/svg+xml" />
	<link rel="stylesheet" href="_preview/component-base.css" />
	<link rel="stylesheet" href="button/button.css?v=20260730-9" />
	<link rel="stylesheet" href="sidebar/sidebar.css?v=20260728-2" />
	<link rel="stylesheet" href="_preview/component-index.css?v=20260729-1" />
</head>

<body class="component-index-page">
	<div class="component-index-shell">
		<aside class="sidebar app-sidebar component-index-sidebar" id="componentIndexSidebar">
			<div class="sidebar-top-bar">
				<button type="button" class="sidebar-brand" id="componentIndexBrandButton" aria-label="AI-ONE 홈"
					title="AI-ONE 홈">
					<span class="brand-logo">
						<img class="brand-symbol" src="../assets/icons/ai-one-logo.svg" alt="AI-ONE" data-icon="ai-one-logo" />
					</span>
					<span class="brand-text">
						<span class="brand-name">AI-ONE</span>
						<span class="brand-sub">Component Catalog</span>
					</span>
				</button>
				<button type="button" class="icon-button icon-button-ghost sidebar-collapse-btn"
					id="componentIndexSidebarCollapseBtn" aria-label="사이드바 접기" aria-expanded="true" title="사이드바 접기">
					<img class="collapse-icon icon icon-primary" src="../assets/icons/sidebar-collapse.svg"
						data-icon="sidebar-collapse" alt="" aria-hidden="true" />
				</button>
			</div>

			<nav class="sidebar-nav component-index-nav" id="componentIndexNav" aria-label="컴포넌트 목록"
				aria-busy="true">
				<p class="component-index-nav-loading" role="status">컴포넌트 목록을 불러오는 중입니다.</p>
			</nav>

			<div class="sidebar-footer">
				<div class="user-card">
					<span class="user-avatar" aria-hidden="true">
						<img class="icon icon-primary" src="../assets/icons/user.svg" data-icon="user" alt="" />
					</span>
					<div class="user-info">
						<span class="user-name">Component Library</span>
						<span class="user-dept">AI-ONE Design System</span>
					</div>
					<button type="button" class="icon-button icon-button-ghost settings-btn" aria-label="환경설정"
						title="환경설정">
						<img class="icon icon-small" src="../assets/icons/settings-alt.svg" data-icon="settings-alt"
							alt="" aria-hidden="true" />
					</button>
				</div>
			</div>
		</aside>

		<main class="component-index-main">
			<iframe class="component-group-frame" id="componentGroupFrame"
				src="componentgroup-card.html?v=20260729-1" title="컴포넌트 카드를 불러오는 중"
				data-catalog-view="cards"></iframe>
		</main>
	</div>

	<script src="_preview/component-index.js?v=20260729-1"></script>
</body>

</html>
