<!DOCTYPE html>
<html lang="ko" class="control-preview-root">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>FileItem 컴포넌트</title>
	<link rel="icon" href="../../assets/icons/ai-one-logo.svg" type="image/svg+xml" />
	<link rel="stylesheet" href="../_preview/component-base.css?v=20260727" />
	<link rel="stylesheet" href="../file-list/file-list.css?v=20260729-6" />
	<link rel="stylesheet" href="file-item.css?v=20260729-3" />
	<link rel="stylesheet" href="../dropdownmenu/dropdownmenu.css?v=20260728-3" />
	<link rel="stylesheet" href="../modal/modal.css?v=20260729-1" />
	<link rel="stylesheet" href="../_preview/component-preview.css?v=20260727" />
</head>
<body class="control-preview-page">
	<main class="control-preview" data-file-actions data-file-delete-modal="fileItemDeleteModal">
		<header class="control-preview-header">
			<div>
				<h1 class="control-preview-title">FileItem</h1>
				<p class="control-preview-desc">FileList 안에서 파일 하나의 확장자·이름·용량·처리 상태·옵션을 표시하는 행입니다.</p>
			</div>
			<a class="control-preview-back" href="../index.html#card-fileitem" target="_top">컴포넌트 목록</a>
		</header>

		<section class="control-preview-section" aria-labelledby="file-item-title">
			<h2 class="control-preview-section-title" id="file-item-title">완료 상태</h2>
			<ul class="file-list">
				<li class="active pinned" data-file-idx="0">
					<button class="file-item-main" type="button" aria-label="예결위 자료요구서 신예린의원 파일 보기">
						<span class="file-index">21</span>
						<span class="file-type-dot txt" aria-hidden="true"></span>
						<span class="file-icon file-icon-collapsed txt" aria-hidden="true">TXT</span>
						<div class="file-info"><span class="file-name">예결위_자료요구서_신예린의원.txt</span><span class="file-meta">0.5MB · 목록 고정</span></div>
					</button>
					<div class="file-item-side">
						<span class="file-status query-count final">질의5건</span>
						<div class="file-action-wrap dropdown-menu-component" data-dropdown-menu>
							<button class="file-more-btn" type="button" data-dropdown-trigger aria-haspopup="menu"
								aria-label="파일 옵션" aria-expanded="false" aria-controls="fileItemMenu0" title="파일 옵션"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button>
							<div class="dropdown-menu dropdown-menu-compact" id="fileItemMenu0" role="menu" data-placement="bottom-end" hidden>
								<button type="button" class="dropdown-menu-item" role="menuitem"
									data-menu-value="pin" aria-pressed="true">목록 고정 해제</button>
								<button type="button" class="dropdown-menu-item danger" role="menuitem" data-menu-value="delete">삭제</button>
							</div>
						</div>
					</div>
				</li>
			</ul>
		</section>

		<section class="control-preview-section" aria-labelledby="file-item-progress-title">
			<h2 class="control-preview-section-title" id="file-item-progress-title">처리 중 상태</h2>
			<ul class="file-list">
				<li data-file-idx="1">
					<button class="file-item-main" type="button" aria-label="예결위 질의서 박소연의원 파일 보기">
						<span class="file-index">20</span>
						<span class="file-type-dot pdf processing" aria-hidden="true"></span>
						<span class="file-icon file-icon-collapsed pdf" aria-hidden="true">PDF</span>
						<div class="file-info"><span class="file-name">예결위_질의서_박소연의원.pdf</span><span class="file-meta">1.3MB</span></div>
					</button>
					<div class="file-item-side">
						<span class="file-status parsing">파싱 중</span>
						<div class="file-action-wrap dropdown-menu-component" data-dropdown-menu>
							<button class="file-more-btn" type="button" data-dropdown-trigger aria-haspopup="menu"
								aria-label="파일 옵션" aria-expanded="false" aria-controls="fileItemMenu1" title="파일 옵션"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button>
							<div class="dropdown-menu dropdown-menu-compact" id="fileItemMenu1" role="menu" data-placement="bottom-end" hidden>
								<button type="button" class="dropdown-menu-item" role="menuitem"
									data-menu-value="pin" aria-pressed="false">목록 고정</button>
								<button type="button" class="dropdown-menu-item danger" role="menuitem" data-menu-value="delete">삭제</button>
							</div>
						</div>
					</div>
				</li>
			</ul>
		</section>

		<section class="control-preview-section" aria-labelledby="file-item-simple-title">
			<h2 class="control-preview-section-title" id="file-item-simple-title">Simple 상태</h2>
			<ul class="file-list simple">
				<li class="file-item-simple">
					<span class="file-dot" style="background:var(--red)" aria-hidden="true"></span>
					<span class="file-name-simple">예결위_질의서_박소연의원.pdf</span>
					<span class="file-status-badge done">청킹 완료 9청크</span>
					<button class="file-remove-simple" type="button" aria-label="파일 삭제">×</button>
				</li>
			</ul>
		</section>
	</main>

	<div class="custom-modal-backdrop" id="fileItemDeleteModal" data-modal hidden>
		<section class="custom-modal modal-medium" role="dialog" aria-modal="true"
			aria-labelledby="fileItemDeleteModalTitle" aria-describedby="fileItemDeleteModalDescription">
			<div class="custom-modal-icon danger" aria-hidden="true">⚠</div>
			<div class="custom-modal-title" id="fileItemDeleteModalTitle">파일 삭제</div>
			<div class="custom-modal-msg" id="fileItemDeleteModalDescription">
				<strong data-file-delete-name>선택한 파일</strong><br />
				질의 업로드 목록에서 삭제하시겠습니까?
			</div>
			<div class="custom-modal-actions">
				<button type="button" class="btn-cancel" data-modal-close>취소</button>
				<button type="button" class="btn-confirm danger" data-file-delete-confirm>삭제</button>
			</div>
		</section>
	</div>

	<script src="../dropdownmenu/dropdownmenu.js?v=20260728-2"></script>
	<script src="../_shared/layer-controller.js?v=20260728-2"></script>
	<script src="../modal/modal.js?v=20260728-4"></script>
	<script src="file-item.js?v=20260729-2"></script>
</body>
</html>
