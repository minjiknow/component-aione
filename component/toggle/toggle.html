<!DOCTYPE html>
<html lang="ko" class="control-preview-root">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Toggle 컴포넌트</title>
	<link rel="icon" href="../../assets/icons/ai-one-logo.svg" type="image/svg+xml" />
	<link rel="stylesheet" href="../_preview/component-base.css?v=20260727" />
	<link rel="stylesheet" href="toggle.css?v=20260728" />
	<link rel="stylesheet" href="../_preview/component-preview.css?v=20260727" />
</head>
<body class="control-preview-page">
	<main class="control-preview">
		<header class="control-preview-header">
			<div>
				<h1 class="control-preview-title">Toggle</h1>
				<p class="control-preview-desc">체크박스의 상태 동작을 유지하고 스위치 모양으로 표시합니다.</p>
			</div>
			<a class="control-preview-back" href="../index.html#forms">컴포넌트 목록</a>
		</header>

		<section class="control-preview-section" aria-labelledby="toggle-states-title">
			<h2 class="control-preview-section-title" id="toggle-states-title">상태</h2>
			<div class="control-toggle-list">
				<label class="toggle-row"><span class="toggle-content"><span class="toggle-title">자동 분류</span><span class="toggle-desc">분류 규칙을 자동으로 적용합니다.</span></span><span class="toggle-switch"><input type="checkbox" name="autoClassification" role="switch" /><span class="toggle-slider" aria-hidden="true"></span></span></label>
				<label class="toggle-row"><span class="toggle-content"><span class="toggle-title">하이라이트 표시</span><span class="toggle-desc">문서의 주요 문장을 강조합니다.</span></span><span class="toggle-switch"><input type="checkbox" name="documentHighlight" role="switch" checked /><span class="toggle-slider" aria-hidden="true"></span></span></label>
				<label class="toggle-row"><span class="toggle-content"><span class="toggle-title">잠긴 설정</span><span class="toggle-desc">권한이 없어 변경할 수 없습니다.</span></span><span class="toggle-switch"><input type="checkbox" name="lockedSetting" role="switch" disabled /><span class="toggle-slider" aria-hidden="true"></span></span></label>
				<label class="toggle-row"><span class="toggle-content"><span class="toggle-title">활성 상태로 잠긴 설정</span><span class="toggle-desc">관리자 정책으로 항상 사용합니다.</span></span><span class="toggle-switch"><input type="checkbox" name="requiredSetting" role="switch" checked disabled /><span class="toggle-slider" aria-hidden="true"></span></span></label>
			</div>
		</section>
	</main>
</body>
</html>
