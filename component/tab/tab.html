<!DOCTYPE html>
<html lang="ko" class="control-preview-root">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Tab 컴포넌트</title>
	<link rel="icon" href="../../assets/icons/ai-one-logo.svg" type="image/svg+xml" />
	<link rel="stylesheet" href="../_preview/component-base.css?v=20260727" />
	<link rel="stylesheet" href="tab.css?v=20260728" />
	<link rel="stylesheet" href="../_preview/component-preview.css?v=20260727" />
</head>
<body class="control-preview-page">
	<main class="control-preview">
		<header class="control-preview-header">
			<div>
				<h1 class="control-preview-title">Tab</h1>
				<p class="control-preview-desc">AI Intake 문서 보기처럼 활성 항목을 파란 글자와 하단선으로 표시하는 텍스트 탭입니다.</p>
			</div>
			<a class="control-preview-back" href="../index.html#navigation">컴포넌트 목록</a>
		</header>

		<section class="control-preview-section" aria-labelledby="default-tab-title">
			<h2 class="control-preview-section-title" id="default-tab-title">기본형</h2>
			<div class="tabs" data-tabs>
				<div class="tab-list" role="tablist" aria-label="문서 보기">
					<button type="button" class="tab" id="defaultTabHighlight" role="tab" aria-selected="false" aria-controls="defaultTabPanelHighlight" tabindex="-1" data-tab-value="highlight">하이라이트 보기</button>
					<button type="button" class="tab" id="defaultTabText" role="tab" aria-selected="false" aria-controls="defaultTabPanelText" tabindex="-1" data-tab-value="text">텍스트 보기</button>
					<button type="button" class="tab is-active" id="defaultTabOriginal" role="tab" aria-selected="true" aria-controls="defaultTabPanelOriginal" data-tab-value="original">원본 보기</button>
				</div>
				<div class="tab-panel tab-preview-panel" id="defaultTabPanelHighlight" role="tabpanel" aria-labelledby="defaultTabHighlight" tabindex="0" hidden>
					<p class="tab-preview-panel-title">하이라이트 보기</p>
					<p class="tab-preview-panel-desc">문서에서 추출한 질의를 강조해 표시합니다.</p>
				</div>
				<div class="tab-panel tab-preview-panel" id="defaultTabPanelText" role="tabpanel" aria-labelledby="defaultTabText" tabindex="0" hidden>
					<p class="tab-preview-panel-title">텍스트 보기</p>
					<p class="tab-preview-panel-desc">문서에서 추출한 텍스트를 표시합니다.</p>
				</div>
				<div class="tab-panel tab-preview-panel is-active" id="defaultTabPanelOriginal" role="tabpanel" aria-labelledby="defaultTabOriginal" tabindex="0">
					<p class="tab-preview-panel-title">원본 보기</p>
					<p class="tab-preview-panel-desc">업로드한 문서의 원본 화면을 표시합니다.</p>
				</div>
			</div>
		</section>
	</main>

	<script src="../../js/common.js?v=20260723"></script>
	<script src="../_preview/component-preview.js?v=20260723"></script>
</body>
</html>
