<!DOCTYPE html>
<html lang="ko" class="control-preview-root">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>DropdownMenu 컴포넌트</title>
	<link rel="icon" href="../../assets/icons/ai-one-logo.svg" type="image/svg+xml" />
	<link rel="stylesheet" href="../_preview/component-base.css?v=20260727" />
	<link rel="stylesheet" href="../button/button.css?v=20260728" />
	<link rel="stylesheet" href="../form-field/form-field.css?v=20260728" />
	<link rel="stylesheet" href="dropdownmenu.css?v=20260728-3" />
	<link rel="stylesheet" href="../_preview/component-preview.css?v=20260728-5" />
</head>
<body class="control-preview-page" data-root-path="../..">
	<main class="control-preview">
		<header class="control-preview-header">
			<div>
				<h1 class="control-preview-title">DropdownMenu</h1>
				<p class="control-preview-desc">기존 AI-ONE 홈과 챗봇의 모델 선택 메뉴를 공통 동작 계약으로 정리한 DropdownMenu입니다.</p>
			</div>
			<a class="control-preview-back" href="../index.html#card-dropdownmenu" target="_top">컴포넌트 목록</a>
		</header>

		<section class="control-preview-section" aria-labelledby="dropdown-model-title">
			<h2 class="control-preview-section-title" id="dropdown-model-title">Model selection · Existing style</h2>
			<p class="field-help">기존 <code>html/ai-home.html</code>과 <code>html/ai-chatbot.html</code>의 모델 선택 메뉴를 재사용합니다.</p>
			<div class="dropdown-menu-model-stage">
				<div class="dropdown-menu-component" data-dropdown-menu>
					<button type="button" class="button dropdown-menu-model-trigger" data-dropdown-trigger
						aria-haspopup="menu" aria-expanded="false" aria-controls="modelDropdownMenu">
						<span data-dropdown-label>기본</span>
						<img class="icon icon-xsmall" data-icon="chevron-down" alt="" aria-hidden="true" />
					</button>
					<div class="dropdown-menu dropdown-menu-model" id="modelDropdownMenu" role="menu"
						data-placement="top-start" hidden>
						<span class="dropdown-menu-label">모델 선택</span>
						<button type="button" class="dropdown-menu-item" role="menuitemradio"
							aria-checked="true" data-menu-value="default" data-menu-label="기본">
							<span class="dropdown-model-name">기본</span>
							<span class="dropdown-model-desc">추천</span>
							<span class="dropdown-model-check" aria-hidden="true">✓</span>
						</button>
						<button type="button" class="dropdown-menu-item" role="menuitemradio"
							aria-checked="false" data-menu-value="ai-one-flash" data-menu-label="AI-ONE Flash">
							<span class="dropdown-model-name">AI-ONE Flash</span>
							<span class="dropdown-model-desc">빠르고 반복적인 모델</span>
							<span class="dropdown-model-check" aria-hidden="true">✓</span>
						</button>
						<button type="button" class="dropdown-menu-item" role="menuitemradio"
							aria-checked="false" data-menu-value="ai-one-pro" data-menu-label="AI-ONE Pro">
							<span class="dropdown-model-name">AI-ONE Pro</span>
							<span class="dropdown-model-desc">심도 있고 창의적인 모델</span>
							<span class="dropdown-model-check" aria-hidden="true">✓</span>
						</button>
						<button type="button" class="dropdown-menu-item" role="menuitemradio"
							aria-checked="false" data-menu-value="gov-flash" data-menu-label="범정부 AI Flash">
							<span class="dropdown-model-name">범정부 AI Flash</span>
							<span class="dropdown-model-desc">균형과 효율성 겸비</span>
							<span class="dropdown-model-check" aria-hidden="true">✓</span>
						</button>
						<button type="button" class="dropdown-menu-item" role="menuitemradio"
							aria-checked="false" data-menu-value="gov-pro" data-menu-label="범정부 AI Pro">
							<span class="dropdown-model-name">범정부 AI Pro</span>
							<span class="dropdown-model-desc">능력 있고 빠릅니다</span>
							<span class="dropdown-model-check" aria-hidden="true">✓</span>
						</button>
					</div>
				</div>
			</div>
			<p class="field-help" id="dropdownStatus" role="status">현재 모델: 기본</p>
		</section>

		<section class="control-preview-section" aria-labelledby="dropdown-action-title">
			<h2 class="control-preview-section-title" id="dropdown-action-title">More action · File item</h2>
			<p class="field-help">더보기 아이콘에서 목록 고정과 삭제 작업을 선택하는 소형 메뉴입니다.</p>
			<div class="dropdown-menu-action-stage">
				<div class="dropdown-menu-component" data-dropdown-menu>
					<button type="button" class="icon-button icon-button-ghost dropdown-menu-icon-trigger"
						data-dropdown-trigger aria-haspopup="menu" aria-expanded="false"
						aria-controls="fileActionDropdownMenu" aria-label="파일 옵션" title="파일 옵션">
						<img class="icon icon-small dropdown-menu-more-icon" data-icon="more-horizontal" alt=""
							aria-hidden="true" />
					</button>
					<div class="dropdown-menu dropdown-menu-compact" id="fileActionDropdownMenu" role="menu"
						data-placement="bottom-end" hidden>
						<button type="button" class="dropdown-menu-item" role="menuitem"
							data-menu-value="pin">목록 고정</button>
						<button type="button" class="dropdown-menu-item danger" role="menuitem"
							data-menu-value="delete">삭제</button>
					</div>
				</div>
			</div>
		</section>
	</main>

	<script src="../_preview/component-preview.js?v=20260727"></script>
	<script src="dropdownmenu.js?v=20260728-2"></script>
	<script>
		document.addEventListener("dropdownmenu:select", (event) => {
			if (!event.detail.item.matches('[role="menuitemradio"]')) return;
			const label = event.detail.item.dataset.menuLabel || event.detail.value;
			document.getElementById("dropdownStatus").textContent = `현재 모델: ${label}`;
		});
	</script>
</body>
</html>
