<div class="progressbar-row" data-component="progressbar">
	<span class="progressbar-label" data-slot="label">신뢰도</span>
	<div class="progressbar" data-progressbar data-value="{{value}}" role="progressbar"
		aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{value}}">
		<div class="progressbar-fill"></div>
	</div>
	<span class="progressbar-value" data-progressbar-value>{{value}}%</span>
</div>
