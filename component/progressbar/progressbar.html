<!DOCTYPE html>
<html lang="ko" class="control-preview-root">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>ProgressBar 컴포넌트</title>
	<link rel="icon" href="../../assets/icons/ai-one-logo.svg" type="image/svg+xml" />
	<link rel="stylesheet" href="../_preview/component-base.css?v=20260727" />
	<link rel="stylesheet" href="progressbar.css?v=20260728" />
	<link rel="stylesheet" href="../_preview/component-preview.css?v=20260728-2" />
</head>
<body class="control-preview-page" data-root-path="../..">
	<main class="control-preview">
		<header class="control-preview-header">
			<div>
				<h1 class="control-preview-title">ProgressBar</h1>
				<p class="control-preview-desc">90% 미만은 파란색, 90% 이상은 초록색으로 표시합니다.</p>
			</div>
			<a class="control-preview-back" href="../index.html#display">컴포넌트 목록</a>
		</header>

		<section class="control-preview-section" aria-labelledby="progressbar-variants-title">
			<h2 class="control-preview-section-title" id="progressbar-variants-title">Variants</h2>
			<div class="control-progressbar-preview">
				<div class="progressbar-preview-list">
					<div class="progressbar-row">
						<span class="progressbar-label">신뢰도</span>
						<div class="progressbar" data-progressbar data-value="82" role="progressbar"
							aria-label="신뢰도 82%" aria-valuemin="0" aria-valuemax="100" aria-valuenow="82">
							<div class="progressbar-fill"></div>
						</div>
						<span class="progressbar-value" data-progressbar-value>82%</span>
					</div>

					<div class="progressbar-row">
						<span class="progressbar-label">신뢰도</span>
						<div class="progressbar" data-progressbar data-value="94" role="progressbar"
							aria-label="신뢰도 94%" aria-valuemin="0" aria-valuemax="100" aria-valuenow="94">
							<div class="progressbar-fill"></div>
						</div>
						<span class="progressbar-value" data-progressbar-value>94%</span>
					</div>
				</div>
			</div>
		</section>
	</main>

	<script src="progressbar.js?v=20260728"></script>
	<script src="../_preview/component-preview.js?v=20260727"></script>
</body>
</html>
