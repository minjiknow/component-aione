<!DOCTYPE html>
<html lang="ko" class="control-preview-root">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>ChatMessage 컴포넌트</title>
	<link rel="icon" href="../../assets/icons/ai-one-logo.svg" type="image/svg+xml" />
	<link rel="stylesheet" href="../_preview/component-base.css?v=20260727" />
	<link rel="stylesheet" href="../button/button.css?v=20260730-9" />

</head>
<body class="control-preview-page">
	<main class="control-preview">
		<header class="control-preview-header">
			<div>
				<h1 class="control-preview-title">ChatMessage</h1>
				<p class="control-preview-desc">Answer와 Chatbot 화면에서 역할과 상태를 조합해 사용하는 채팅 메시지입니다.</p>
			</div>
			<a class="control-preview-back" href="../index.html#display">컴포넌트 목록</a>
		</header>

		<section class="control-preview-section" aria-labelledby="chat-message-chatbot-title">
			<h2 class="control-preview-section-title" id="chat-message-chatbot-title">Chatbot variant</h2>
			<div class="chat-messages" data-chat-message-list data-variant="chatbot" aria-label="Chatbot variant 메시지 예시">
				<div class="chat-msg user" data-component="chat-message" data-variant="chatbot" data-role="user">2026년도 주요 재정지표를 알려줘.</div>
				<div class="chat-msg ai" data-component="chat-message" data-variant="chatbot" data-role="ai" data-status="complete">
					<div class="msg-avatar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
					<div class="msg-content">2026년도 예산안의 총수입, 총지출, 관리재정수지와 국가채무비율을 정리해 드릴게요.</div>
					<div class="msg-actions">
						<button class="msg-action-btn" type="button" data-action="like" aria-label="좋아요" aria-pressed="false" title="좋아요"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg></button>
						<button class="msg-action-btn" type="button" data-action="dislike" aria-label="싫어요" aria-pressed="false" title="싫어요"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3H10zM17 2h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg></button>
						<button class="msg-action-btn" type="button" data-action="retry" aria-label="다시 생성" title="다시 생성"><svg viewBox="0 0 24 24" width="14" height="14"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
						<button class="msg-action-btn" type="button" data-action="copy" aria-label="복사" title="복사"><svg viewBox="0 0 24 24" width="14" height="14"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
					</div>
				</div>
				<div class="chat-msg ai is-pending" data-component="chat-message" data-variant="chatbot" data-role="ai" data-status="pending">
					<div class="msg-avatar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
					<div class="msg-content"><span class="chat-typing-ellipsis" role="status" aria-label="답변 생성 중">...</span></div>
				</div>
			</div>
		</section>
		<section class="control-preview-section" aria-labelledby="chat-message-answer-title">
			<h2 class="control-preview-section-title" id="chat-message-answer-title">Answer variant</h2>
			<div class="chat-messages" data-chat-message-list data-variant="answer" aria-label="Answer variant 메시지 예시">
				<div class="chat-msg user" data-component="chat-message" data-variant="answer" data-role="user" data-status="complete">
					<div class="msg-text">질의 답변서의 핵심 내용을 요약해 줘.</div>
					<span class="msg-time">14:31</span>
				</div>
				<div class="chat-msg ai" data-component="chat-message" data-variant="answer" data-role="ai" data-status="complete">
					<div class="msg-avatar"><img src="../../assets/icons/ai-search.svg" alt="" aria-hidden="true" /></div>
					<div class="msg-text">핵심 재정지표와 정책 근거를 중심으로 요약했습니다.</div>
					<span class="msg-time">14:32</span>
					<div class="msg-actions">
						<button class="msg-action-btn" type="button" data-action="like" aria-label="좋아요" aria-pressed="false" title="좋아요"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg></button>
						<button class="msg-action-btn" type="button" data-action="dislike" aria-label="싫어요" aria-pressed="false" title="싫어요"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3H10zM17 2h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg></button>
						<button class="msg-action-btn" type="button" data-action="retry" aria-label="다시 생성" title="다시 생성"><svg viewBox="0 0 24 24" width="14" height="14"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
						<button class="msg-action-btn" type="button" data-action="copy" aria-label="복사" title="복사"><svg viewBox="0 0 24 24" width="14" height="14"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
					</div>
				</div>
				<div class="chat-msg ai is-pending chat-typing" data-component="chat-message" data-variant="answer" data-role="ai" data-status="pending" aria-busy="true">
					<div class="typing-avatar"><img src="../../assets/icons/ai-search.svg" alt="" aria-hidden="true" /></div>
					<div class="typing-content" role="status">
						<div class="typing-text-wrap">
							<span class="typing-title">생성 중</span>
							<span class="typing-desc">답변서 초안을 생성하고 있습니다...</span>
						</div>
						<div class="typing-dots" aria-hidden="true"><span></span><span></span><span></span></div>
					</div>
				</div>
			</div>
		</section>
	</main>
	<script src="chat-message.js?v=20260728-1"></script>
</body>
</html>
