<div class="chat-messages" data-component="chat-message-list"
	data-chat-message-list data-variant="{{variant}}">
	<div class="chat-msg {{role}}" data-component="chat-message"
		data-variant="{{variant}}" data-role="{{role}}" data-status="{{status}}">
		<div data-slot="avatar"></div>
		<div class="msg-content" data-slot="content"></div>
		<div class="msg-actions" data-slot="actions"></div>
	</div>
</div>
