<!DOCTYPE html>
<html lang="ko" class="control-preview-root">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>FileList 컴포넌트</title>
	<link rel="icon" href="../../assets/icons/ai-one-logo.svg" type="image/svg+xml" />
	<link rel="stylesheet" href="../_preview/component-base.css?v=20260727" />
	<link rel="stylesheet" href="file-list.css?v=20260728-2" />
	<link rel="stylesheet" href="../file-item/file-item.css?v=20260728-2" />
	<link rel="stylesheet" href="../dropdownmenu/dropdownmenu.css?v=20260728-3" />
	<link rel="stylesheet" href="../modal/modal.css?v=20260728-7" />
	<link rel="stylesheet" href="../_preview/component-preview.css?v=20260727" />
</head>
<body class="control-preview-page">
	<main class="control-preview" data-file-actions data-file-delete-modal="fileListDeleteModal">
		<header class="control-preview-header">
			<div>
				<h1 class="control-preview-title">FileList</h1>
				<p class="control-preview-desc">AI Intake의 업로드 목록 전체 영역입니다. 헤더·업로드 현황·FileItem 목록을 함께 구성합니다.</p>
			</div>
			<a class="control-preview-back" href="../index.html#card-filelist" target="_top">컴포넌트 목록</a>
		</header>

		<section class="control-preview-section" aria-labelledby="file-list-title">
			<h2 class="control-preview-section-title" id="file-list-title">업로드 목록</h2>
			<div class="file-list-section">
				<div class="file-list-header">
					<div class="file-list-heading"><span class="file-list-title">질의 업로드 목록</span></div>
					<div class="upload-summary-inline" aria-label="업로드 현황"><span class="upload-summary-label">파일수/의원수</span><span class="upload-summary-value"><strong class="upload-summary-file-count match">2</strong> / <span class="upload-summary-member-count">2</span></span></div>
				</div>
				<ul class="file-list">
					<li class="active" data-file-idx="0">
						<button class="file-item-main" type="button" aria-label="예결위 질의서 박소연의원 파일 보기">
							<div class="file-icon pdf">PDF</div>
							<div class="file-info"><span class="file-name">예결위_질의서_박소연의원.pdf</span><span class="file-meta">1.3MB</span></div>
						</button>
						<div class="file-item-side">
							<span class="file-status-group final"><span class="file-status parsed">청킹 완료</span><span class="file-status query-count final">질의 9건</span></span>
							<div class="file-action-wrap dropdown-menu-component" data-dropdown-menu>
								<button class="file-more-btn" type="button" data-dropdown-trigger aria-haspopup="menu"
									aria-label="파일 옵션" aria-expanded="false" aria-controls="fileListMenu0" title="파일 옵션"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button>
								<div class="dropdown-menu dropdown-menu-compact" id="fileListMenu0" role="menu" data-placement="bottom-end" hidden>
									<button type="button" class="dropdown-menu-item" role="menuitem"
										data-menu-value="pin" aria-pressed="false">목록 고정</button>
									<button type="button" class="dropdown-menu-item danger" role="menuitem" data-menu-value="delete">삭제</button>
								</div>
							</div>
						</div>
					</li>
					<li data-file-idx="1">
						<button class="file-item-main" type="button" aria-label="예결위 질의요지서 정예진의원 파일 보기">
							<div class="file-icon docx">DOCX</div>
							<div class="file-info"><span class="file-name">예결위_질의요지서_정예진의원.docx</span><span class="file-meta">1.4MB</span></div>
						</button>
						<div class="file-item-side">
							<span class="file-status summarizing">SLM 자연어화</span>
							<div class="file-action-wrap dropdown-menu-component" data-dropdown-menu>
								<button class="file-more-btn" type="button" data-dropdown-trigger aria-haspopup="menu"
									aria-label="파일 옵션" aria-expanded="false" aria-controls="fileListMenu1" title="파일 옵션"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button>
								<div class="dropdown-menu dropdown-menu-compact" id="fileListMenu1" role="menu" data-placement="bottom-end" hidden>
									<button type="button" class="dropdown-menu-item" role="menuitem"
										data-menu-value="pin" aria-pressed="false">목록 고정</button>
									<button type="button" class="dropdown-menu-item danger" role="menuitem" data-menu-value="delete">삭제</button>
								</div>
							</div>
						</div>
					</li>
				</ul>
			</div>
		</section>

		<section class="control-preview-section" aria-labelledby="file-list-simple-title">
			<h2 class="control-preview-section-title" id="file-list-simple-title">Simple 목록</h2>
			<ul class="file-list simple" aria-label="간단 파일 목록">
				<li class="file-item-simple">
					<span class="file-dot" style="background:var(--red)" aria-hidden="true"></span>
					<span class="file-name-simple">예결위_질의서_박소연의원.pdf</span>
					<span class="file-status-badge done">청킹 완료 9청크</span>
					<button class="file-remove-simple" type="button" aria-label="파일 삭제">×</button>
				</li>
				<li class="file-item-simple">
					<span class="file-dot processing" style="background:var(--primary)" aria-hidden="true"></span>
					<span class="file-name-simple">예결위_질의요지서_정예진의원.docx</span>
					<span class="file-status-badge summarizing">SLM 자연어화</span>
					<button class="file-remove-simple" type="button" aria-label="파일 삭제">×</button>
				</li>
			</ul>
		</section>
	</main>

	<div class="custom-modal-backdrop" id="fileListDeleteModal" data-modal hidden>
		<section class="custom-modal modal-medium" role="dialog" aria-modal="true"
			aria-labelledby="fileListDeleteModalTitle" aria-describedby="fileListDeleteModalDescription">
			<div class="custom-modal-icon danger" aria-hidden="true">⚠</div>
			<div class="custom-modal-title" id="fileListDeleteModalTitle">파일을 삭제할까요?</div>
			<div class="custom-modal-msg" id="fileListDeleteModalDescription">
				<strong data-file-delete-name>선택한 파일</strong><br />
				질의 업로드 목록에서 삭제하시겠습니까?
			</div>
			<div class="custom-modal-actions">
				<button type="button" class="btn-cancel" data-modal-close>취소</button>
				<button type="button" class="btn-confirm danger" data-file-delete-confirm>삭제</button>
			</div>
		</section>
	</div>

	<script src="../dropdownmenu/dropdownmenu.js?v=20260728-2"></script>
	<script src="../_shared/layer-controller.js?v=20260728-2"></script>
	<script src="../modal/modal.js?v=20260728-4"></script>
	<script src="../file-item/file-item.js?v=20260728-1"></script>
</body>
</html>
