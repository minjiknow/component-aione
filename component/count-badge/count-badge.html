<!DOCTYPE html>
<html lang="ko" class="control-preview-root">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>CountBadge 컴포넌트</title>
	<link rel="icon" href="../../assets/icons/ai-one-logo.svg" type="image/svg+xml" />
	<link rel="stylesheet" href="../_preview/component-base.css?v=20260727" />
	<link rel="stylesheet" href="../../css/common.css?v=20260727" />
	<link rel="stylesheet" href="../_preview/component-preview.css?v=20260727" />
</head>
<body class="control-preview-page">
	<main class="control-preview">
		<header class="control-preview-header">
			<div>
				<h1 class="control-preview-title">CountBadge</h1>
				<p class="control-preview-desc">필터 항목의 건수를 표시하는 기존 카운트 배지를 독립적으로 확인합니다.</p>
			</div>
			<a class="control-preview-back" href="../index.html#display">컴포넌트 목록</a>
		</header>

		<section class="control-preview-section" aria-labelledby="count-badge-title">
			<h2 class="control-preview-section-title" id="count-badge-title">카운트</h2>
			<div class="control-use-list">
				<article class="control-use-case"><span class="control-use-label">Zero</span><span class="filter-count" aria-label="0건">0</span></article>
				<article class="control-use-case"><span class="control-use-label">Default</span><span class="filter-count" aria-label="8건">8</span></article>
				<article class="control-use-case"><span class="control-use-label">Maximum</span><span class="filter-count" aria-label="99건 이상">99+</span></article>
			</div>
		</section>
	</main>
</body>
</html>
