<!DOCTYPE html>
<html lang="ko" class="control-preview-root">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>PromptComposer 컴포넌트</title>
	<link rel="icon" href="../../assets/icons/ai-one-logo.svg" type="image/svg+xml" />
	<link rel="stylesheet" href="../_preview/component-base.css?v=20260727" />
	<link rel="stylesheet" href="../button/button.css?v=20260728" />
	<link rel="stylesheet" href="../form-field/form-field.css?v=20260728" />
	<link rel="stylesheet" href="../dropdownmenu/dropdownmenu.css?v=20260728-3" />
	<link rel="stylesheet" href="promptcomposer.css?v=20260728-2" />
	<link rel="stylesheet" href="../_preview/component-preview.css?v=20260727" />
</head>
<body class="control-preview-page" data-root-path="../..">
	<main class="control-preview control-preview-wide">
		<header class="control-preview-header">
			<div>
				<h1 class="control-preview-title">PromptComposer</h1>
				<p class="control-preview-desc">기존 홈 화면의 AI 입력창을 공통화한 한 줄 캡슐형 PromptComposer입니다.</p>
			</div>
			<a class="control-preview-back" href="../index.html#forms">컴포넌트 목록</a>
		</header>

		<section class="control-preview-section" aria-labelledby="prompt-composer-default-title">
			<h2 class="control-preview-section-title" id="prompt-composer-default-title">Default</h2>
			<div class="prompt-composer-demo-stage">
				<div class="prompt-composer-shell" data-prompt-composer>
					<form class="prompt-composer">
						<div class="prompt-composer-tools">
							<input class="prompt-composer-file-input" id="promptComposerFiles" type="file"
								data-prompt-file-input multiple />
							<button type="button" class="icon-button icon-button-ghost prompt-composer-attach"
								data-prompt-attach aria-label="파일 첨부" title="파일 첨부">
								<img class="icon icon-small" data-icon="plus" alt="" aria-hidden="true" />
							</button>
						</div>
						<label for="promptComposerInput" class="prompt-composer-file-input">프롬프트</label>
						<input class="prompt-composer-input" id="promptComposerInput" name="prompt"
							data-prompt-input type="text" maxlength="2000"
							placeholder="AI-ONE에게 물어보기" />
						<div class="prompt-composer-actions">
							<div class="dropdown-menu-component" data-dropdown-menu>
								<button type="button" class="button dropdown-menu-model-trigger" data-dropdown-trigger
									aria-haspopup="menu" aria-expanded="false" aria-controls="promptModelMenu">
									<span data-dropdown-label>기본</span>
									<img class="icon icon-xsmall" data-icon="chevron-down" alt="" aria-hidden="true" />
								</button>
								<div class="dropdown-menu dropdown-menu-model" id="promptModelMenu" role="menu"
									data-placement="top-end" hidden>
									<span class="dropdown-menu-label">모델 선택</span>
									<button type="button" class="dropdown-menu-item" role="menuitemradio"
										aria-checked="true" data-menu-value="default" data-menu-label="기본">
										<span class="dropdown-model-name">기본</span>
										<span class="dropdown-model-desc">추천</span>
										<span class="dropdown-model-check" aria-hidden="true">✓</span>
									</button>
									<button type="button" class="dropdown-menu-item" role="menuitemradio"
										aria-checked="false" data-menu-value="ai-one-flash" data-menu-label="AI-ONE Flash">
										<span class="dropdown-model-name">AI-ONE Flash</span>
										<span class="dropdown-model-desc">빠르고 반복적인 모델</span>
										<span class="dropdown-model-check" aria-hidden="true">✓</span>
									</button>
									<button type="button" class="dropdown-menu-item" role="menuitemradio"
										aria-checked="false" data-menu-value="pro" data-menu-label="AI-ONE Pro">
										<span class="dropdown-model-name">AI-ONE Pro</span>
										<span class="dropdown-model-desc">심도 있고 창의적인 모델</span>
										<span class="dropdown-model-check" aria-hidden="true">✓</span>
									</button>
									<button type="button" class="dropdown-menu-item" role="menuitemradio"
										aria-checked="false" data-menu-value="government-flash" data-menu-label="범정부 AI Flash">
										<span class="dropdown-model-name">범정부 AI Flash</span>
										<span class="dropdown-model-desc">균형과 효율성 겸비</span>
										<span class="dropdown-model-check" aria-hidden="true">✓</span>
									</button>
									<button type="button" class="dropdown-menu-item" role="menuitemradio"
										aria-checked="false" data-menu-value="government-pro" data-menu-label="범정부 AI Pro">
										<span class="dropdown-model-name">범정부 AI Pro</span>
										<span class="dropdown-model-desc">능력 있고 빠릅니다</span>
										<span class="dropdown-model-check" aria-hidden="true">✓</span>
									</button>
								</div>
							</div>
							<button type="submit" class="icon-button icon-button-primary prompt-composer-submit"
								data-prompt-submit aria-label="프롬프트 전송" title="프롬프트 전송" disabled>
								<img class="icon icon-primary" data-icon="send" alt="" aria-hidden="true" />
							</button>
						</div>
					</form>
					<div class="prompt-composer-files" data-prompt-files aria-live="polite"></div>
				</div>
			</div>
			<p class="field-help" id="promptComposerStatus" role="status">Enter로 전송합니다.</p>
		</section>

		<section class="control-preview-section" aria-labelledby="prompt-composer-disabled-title">
			<h2 class="control-preview-section-title" id="prompt-composer-disabled-title">Disabled input</h2>
			<div class="prompt-composer-shell">
				<form class="prompt-composer" aria-disabled="true">
					<div class="prompt-composer-tools">
						<button type="button" class="icon-button icon-button-ghost prompt-composer-attach"
							aria-label="파일 첨부" disabled>
							<img class="icon icon-small" data-icon="plus" alt="" aria-hidden="true" />
						</button>
					</div>
					<input class="prompt-composer-input" type="text"
						value="응답을 생성하는 동안에는 새 요청을 입력할 수 없습니다." disabled />
					<div class="prompt-composer-actions">
						<button type="button" class="button dropdown-menu-model-trigger" disabled>기본</button>
						<button type="button" class="icon-button icon-button-primary prompt-composer-submit"
							aria-label="프롬프트 전송" disabled>
							<img class="icon icon-primary" data-icon="send" alt="" aria-hidden="true" />
						</button>
					</div>
				</form>
			</div>
		</section>
	</main>

	<script src="../_preview/component-preview.js?v=20260727"></script>
	<script src="../dropdownmenu/dropdownmenu.js?v=20260728"></script>
	<script src="promptcomposer.js?v=20260728"></script>
	<script>
		document.querySelector("[data-prompt-composer]")?.addEventListener("promptcomposer:submit", (event) => {
			document.getElementById("promptComposerStatus").textContent = `"${event.detail.value}" 전송 이벤트가 발생했습니다.`;
		});
	</script>
</body>
</html>
