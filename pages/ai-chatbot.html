<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>AI-ONE 챗봇 — AI-ONE</title>
	<link rel="stylesheet" as="style" crossorigin
		href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
	<link rel="stylesheet" href="../css/common.css" />
	<link rel="stylesheet" href="../css/ai-chatbot.css" />
</head>

<body data-page="chatbot" data-root-path="..">

	<!-- Chatbot Sidebar Component -->
	<div data-include="sidebar/sidebar-chatbot" data-include-source="html"></div>

	<!-- ── Main ── -->
	<div class="main-wrap" id="mainWrap">
		<div class="bg-orb bg-orb-1"></div>
		<div class="bg-orb bg-orb-2"></div>
		<div class="bg-orb bg-orb-3"></div>
		<div class="bg-orb bg-orb-4"></div>
		<div class="bg-orb bg-orb-5"></div>
		<div class="chat-container" id="chatContainer">
			<!-- Empty state -->
			<div class="chat-empty" id="chatEmpty">
				<h1 class="chat-empty-title">무엇을 도와드릴까요?</h1>
				<div class="chat-input-box chat-input-box-center">
					<button type="button" class="icon-button icon-button-ghost chat-attach-btn" title="파일 첨부" aria-label="파일 첨부"><img class="icon icon-primary" data-icon="plus" alt="" aria-hidden="true" /></button>
					<input type="text" class="chat-input" id="chatInputCenter" placeholder="AI-ONE에게 물어보기" />
					<div class="chat-input-right">
						<div class="model-picker" id="modelPickerCenter">
							<button class="model-picker-btn" id="modelPickerBtnCenter"><span
									class="model-picker-label">기본</span> <img class="icon icon-xsmall" data-icon="chevron-down" alt="" aria-hidden="true" /></button>
							<div class="model-picker-dropdown hidden" id="modelDropdownCenter">
								<div class="model-dropdown-title">모델 선택</div>
								<div class="model-option active" data-model="default"><span
										class="model-opt-name">기본</span><span class="model-opt-desc">추천</span><span
										class="model-opt-check">✓</span></div>
								<div class="model-option" data-model="ai-one-flash"><span class="model-opt-name">AI-ONE
										Flash</span><span class="model-opt-desc">빠르고 반복적인 모델</span></div>
								<div class="model-option" data-model="ai-one-pro"><span class="model-opt-name">AI-ONE
										Pro</span><span class="model-opt-desc">심도 있고 창의적인 모델</span></div>
								<div class="model-option" data-model="gov-flash"><span class="model-opt-name">범정부 AI
										Flash</span><span class="model-opt-desc">균형과 효율성 겸비</span></div>
								<div class="model-option" data-model="gov-pro"><span class="model-opt-name">범정부 AI
										Pro</span><span class="model-opt-desc">능력 있고 빠릅니다</span></div>
							</div>
						</div>
						<button type="button" class="icon-button icon-button-primary icon-button-send chat-send-btn" id="chatSendBtnCenter"
							aria-label="전송" title="전송">
							<img class="icon icon-primary" data-icon="send" alt="" aria-hidden="true" />
						</button>
					</div>
				</div>
			</div>
			<!-- Messages -->
			<div class="chat-messages" id="chatMessages"></div>
		</div>
		<!-- Input (shown when chatting) -->
		<div class="chat-input-wrapper hidden" id="chatInputWrapper">
			<div class="chat-input-box">
				<button type="button" class="icon-button icon-button-ghost chat-attach-btn" title="파일 첨부" aria-label="파일 첨부"><img class="icon icon-primary" data-icon="plus" alt="" aria-hidden="true" /></button>
				<input type="text" class="chat-input" id="chatInput" placeholder="AI-ONE에게 물어보기" />
				<div class="chat-input-right">
					<div class="model-picker" id="modelPicker">
						<button class="model-picker-btn" id="modelPickerBtn"><span class="model-picker-label">기본</span>
							<img class="icon icon-xsmall" data-icon="chevron-down" alt="" aria-hidden="true" /></button>
						<div class="model-picker-dropdown hidden" id="modelDropdown">
							<div class="model-dropdown-title">모델 선택</div>
							<div class="model-option active" data-model="default"><span
									class="model-opt-name">기본</span><span class="model-opt-desc">추천</span><span
									class="model-opt-check">✓</span></div>
							<div class="model-option" data-model="ai-one-flash"><span class="model-opt-name">AI-ONE
									Flash</span><span class="model-opt-desc">빠르고 반복적인 모델</span></div>
							<div class="model-option" data-model="ai-one-pro"><span class="model-opt-name">AI-ONE
									Pro</span><span class="model-opt-desc">심도 있고 창의적인 모델</span></div>
							<div class="model-option" data-model="gov-flash"><span class="model-opt-name">범정부 AI
									Flash</span><span class="model-opt-desc">균형과 효율성 겸비</span></div>
							<div class="model-option" data-model="gov-pro"><span class="model-opt-name">범정부 AI
									Pro</span><span class="model-opt-desc">능력 있고 빠릅니다</span></div>
						</div>
					</div>
					<button type="button" class="icon-button icon-button-primary icon-button-send chat-send-btn" id="chatSendBtn" aria-label="전송" title="전송">
						<img class="icon icon-primary" data-icon="send" alt="" aria-hidden="true" />
					</button>
				</div>
			</div>
		</div>
	</div>

	<script src="../js/common.js"></script>
	<script src="../js/ai-chatbot.js"></script>
</body>

</html>
