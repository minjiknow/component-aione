<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI-ONE 로그인</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link rel="stylesheet" href="../css/common.css" />
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body data-page="login" data-root-path="..">
  <!-- Aurora Background (Light) -->
  <div class="aurora-bg">
    <div class="aurora aurora-1"></div>
    <div class="aurora aurora-2"></div>
    <div class="aurora aurora-3"></div>
    <div class="aurora aurora-4"></div>
    <div class="aurora-ring ring-1"></div>
    <div class="aurora-ring ring-2"></div>
    <div class="aurora-ring ring-3"></div>
    <div class="light-flare"></div>
  </div>

  <!-- Login Card -->
  <div class="login-wrap">
    <div class="login-card">
      <!-- Logo -->
      <div class="login-logo">
        <img class="login-symbol" data-icon="ai-one-logo" alt="AI-ONE" />
        <h1 class="login-title">AI-ONE</h1>
        <p class="login-subtitle">재정경제부 AI 플랫폼</p>
      </div>

      <!-- Form -->
      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label for="userId">아이디</label>
          <input type="text" id="userId" class="form-input" placeholder="아이디를 입력하세요" autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="userPw">비밀번호</label>
          <input type="password" id="userPw" class="form-input" placeholder="비밀번호를 입력하세요" autocomplete="current-password" />
        </div>
        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" />
            <span>로그인 상태 유지</span>
          </label>
        </div>
        <button type="submit" class="login-btn">로그인</button>
      </form>

      <p class="login-footer">© 2026 AI-ONE Platform. 재정경제부</p>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
