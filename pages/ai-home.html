<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>AI-ONE 홈</title>
	<link rel="icon" href="../assets/icons/ai-one-logo.svg" type="image/svg+xml" />
	<link rel="stylesheet" href="../css/common.css?v=20260731-5" />
	<link rel="stylesheet" href="../css/ai-home.css?v=20260731-7" />
	<link rel="stylesheet" href="../component/button/button.css?v=20260731-3" />
	<link rel="stylesheet" href="../component/badge/badge.css?v=20260731-3" />
	<link rel="stylesheet" href="../component/service-card/service-card.css?v=20260731-3" />
	<link rel="stylesheet" href="../component/sidebar/sidebar.css?v=20260731-4" />
	<link rel="stylesheet" href="../component/topbar/topbar.css?v=20260731-4" />
</head>
<body class="ai-home-page" data-page="home">
	<div class="ai-home-app">
		<div class="home-sidebar-host" data-component-include="sidebar"></div>

		<main class="ai-home-main">
			<div data-ai-one-background="home" aria-hidden="true"></div>

			<div class="home-content">
				<header class="home-header">
					<p class="home-eyebrow">AI-ONE PLATFORM</p>
					<h1>환영합니다, 박재정 주무관님!</h1>
					<p class="home-description">무엇을 도와드릴까요?</p>
				</header>

				<div class="home-prompt-composer" data-component-include="promptcomposer"
					data-component-id="homePromptComposer"
					data-component-placeholder="생성형 AI와 대화를 시작합니다."
					data-home-prompt-composer></div>

				<section class="home-services" aria-label="AI 서비스">
					<ul class="service-cards" data-service-card-list></ul>
				</section>

				<section class="home-history" aria-labelledby="homeHistoryTitle">
					<div data-component-include="datatable" data-component-max-width="100%"
						data-component-max-height="316px" data-component-hide-actions="true">
						<template data-slot="title"><span id="homeHistoryTitle">최근 사용 이력</span></template>
						<template data-slot="more">전체 이력 보기 ›</template>
						<template data-slot="caption">AI-ONE 최근 사용 이력</template>
						<template data-slot="rows">
							<tr data-history-target="ai-answer.html" data-history-title="2025년 청년 고용 정책 관련 답변 초안">
								<td>
									<span class="data-table-service">
										<img class="icon" data-icon="document" alt="" aria-hidden="true" />
										<span class="data-table-service-name">국회 답변서 초안 작성</span>
									</span>
								</td>
								<td><span class="type-badge ai">AI초안</span></td>
								<td>2025년 청년 고용 정책 관련 답변 초안</td>
								<td>2025.05.20 10:24</td>
								<td><span class="status-dot done">완료</span></td>
								<td>2025.05.19</td>
								<td class="data-table-actions" hidden></td>
							</tr>
							<tr data-history-target="ai-answer.html" data-history-title="반도체 산업 지원 관련 질의">
								<td>
									<span class="data-table-service">
										<img class="icon" data-icon="search" alt="" aria-hidden="true" />
										<span class="data-table-service-name">국회 질의 자료 검색</span>
									</span>
								</td>
								<td><span class="type-badge search">검색</span></td>
								<td>반도체 산업 지원 관련 질의</td>
								<td>2025.05.20 09:15</td>
								<td><span class="status-dot done">완료</span></td>
								<td>2025.05.18</td>
								<td class="data-table-actions" hidden></td>
							</tr>
							<tr data-history-title="2025년 4월 경제동향 분석">
								<td>
									<span class="data-table-service">
										<img class="icon" data-icon="chart-line" alt="" aria-hidden="true" />
										<span class="data-table-service-name">경제동향 분석 보고서</span>
									</span>
								</td>
								<td><span class="type-badge report">보고서</span></td>
								<td>2025년 4월 경제동향 분석</td>
								<td>2025.05.19 18:40</td>
								<td><span class="status-dot progress">진행 중</span></td>
								<td>2025.05.17</td>
								<td class="data-table-actions" hidden></td>
							</tr>
							<tr data-history-target="ai-answer.html" data-history-title="국정 현안 보고자료 202505">
								<td>
									<span class="data-table-service">
										<img class="icon" data-icon="folder" alt="" aria-hidden="true" />
										<span class="data-table-service-name">내부자료 자산화 관리</span>
									</span>
								</td>
								<td><span class="type-badge doc">문서관리</span></td>
								<td>국정 현안 보고자료 202505</td>
								<td>2025.05.19 14:05</td>
								<td><span class="status-dot done">완료</span></td>
								<td>2025.05.16</td>
								<td class="data-table-actions" hidden></td>
							</tr>
							<tr data-history-target="ai-answer.html" data-history-title="디지털 전환 추진 정책 관련 답변 초안">
								<td>
									<span class="data-table-service">
										<img class="icon" data-icon="document" alt="" aria-hidden="true" />
										<span class="data-table-service-name">국회 답변서 초안 작성</span>
									</span>
								</td>
								<td><span class="type-badge ai">AI초안</span></td>
								<td>디지털 전환 추진 정책 관련 답변 초안</td>
								<td>2025.05.19 11:32</td>
								<td><span class="status-dot done">완료</span></td>
								<td>2025.05.15</td>
								<td class="data-table-actions" hidden></td>
							</tr>
						</template>
					</div>
				</section>
			</div>
		</main>

		<div class="history-modal-backdrop" id="homeHistoryModal" data-home-history-modal
			aria-hidden="true" hidden>
			<section class="history-modal" role="dialog" aria-modal="true"
				aria-labelledby="homeHistoryModalTitle">
				<header class="history-modal-header">
					<h3 id="homeHistoryModalTitle">전체 사용 이력</h3>
					<button type="button" class="history-modal-close" data-home-history-close
						aria-label="전체 사용 이력 닫기">×</button>
				</header>
				<div class="history-modal-search">
					<div class="history-search-box">
						<label class="sr-only" for="homeHistorySearch">전체 사용 이력 검색</label>
						<img src="../assets/icons/search.svg" alt="" aria-hidden="true" />
						<input type="search" id="homeHistorySearch" data-home-history-search
							placeholder="서비스, 유형, 작업 내용, 상태, 일시 검색"
							autocomplete="off" />
						<button type="button" class="history-search-clear" data-home-history-clear
							aria-label="검색어 지우기" hidden>×</button>
					</div>
					<span class="history-search-result" data-home-history-result>총 10건</span>
				</div>
				<div class="history-modal-body">
					<table class="history-table full">
						<caption class="sr-only">AI-ONE 전체 사용 이력</caption>
						<thead>
							<tr>
								<th scope="col">서비스</th>
								<th scope="col">유형</th>
								<th scope="col">작업 내용</th>
								<th scope="col">작업일시</th>
								<th scope="col">상태</th>
								<th scope="col">등록일</th>
							</tr>
						</thead>
						<tbody data-home-history-rows></tbody>
					</table>
					<div class="history-search-empty" data-home-history-empty hidden>
						<img src="../assets/icons/search.svg" alt="" aria-hidden="true" />
						<strong>검색 결과가 없습니다.</strong>
						<span>다른 검색어를 입력해 보세요.</span>
					</div>
				</div>
			</section>
		</div>

		<div data-component-include="toast" data-component-id="homeToast">
			<template data-slot="message">안내 메시지</template>
		</div>
	</div>

	<!-- file:// 전용 fallback: HTTP 환경에서는 component-loader가 원본 fragment를 fetch합니다. -->
	<template data-component-file-fallback="sidebar">
		<aside class="sidebar app-sidebar" id="sidebar">
			<div class="sidebar-top-bar">
				<a class="sidebar-brand" id="sidebarBrandButton" href="../../pages/ai-home.html"
					aria-label="AI-ONE 홈" title="AI-ONE 홈">
					<span class="brand-logo">
						<img class="brand-symbol" alt="AI-ONE" data-icon="ai-one-logo" />
					</span>
					<span class="brand-text">
						<span class="brand-name">AI-ONE</span>
						<span class="brand-sub">재정경제부 AI 플랫폼</span>
					</span>
				</a>
				<button type="button" class="icon-button icon-button-ghost sidebar-collapse-btn" id="sidebarCollapseBtn"
					aria-label="사이드바 접기/펼치기" title="사이드바 접기">
					<img class="collapse-icon icon icon-primary" data-icon="sidebar-collapse" alt="" aria-hidden="true" />
				</button>
			</div>

			<nav class="sidebar-nav" aria-label="메인 네비게이션">
				<div class="nav-group">
					<a class="nav-link" href="../../pages/ai-home.html" data-route="home" data-page="home">
						<img data-icon="home" alt="" aria-hidden="true" />
						<span class="nav-text">AI-ONE 홈</span>
					</a>
				</div>
				<div class="nav-group">
					<span class="nav-group-label">AI 서비스</span>
					<a class="nav-link" href="../../pages/ai-workspace.html" data-route="intake" data-page="intake">
						<img data-icon="document" alt="" aria-hidden="true" />
						<span class="nav-text">국회질의분류</span>
					</a>
					<a class="nav-link" href="../../pages/ai-answer.html" data-route="answer" data-page="answer"
						data-tooltip="국회 답변서 초안 생성"
						aria-label="국회 답변서 초안 생성" title="국회 답변서 초안 생성">
						<img data-icon="edit" alt="" aria-hidden="true" />
						<span class="nav-text">국회 답변서 초안 생성</span>
					</a>
					<button type="button" class="nav-link" data-page="asset"
						data-modal-open="preparingServiceModal"
						aria-label="국유재산 업무 관리 (준비중)" title="국유재산 업무 관리 (준비중)">
						<img data-icon="layers" alt="" aria-hidden="true" />
						<span class="nav-text">국유재산 업무 관리</span>
						<span class="nav-badge-soon">준비중</span>
					</button>
					<button type="button" class="nav-link" data-page="policy"
						data-modal-open="preparingServiceModal"
						aria-label="정책 안내서 (준비중)" title="정책 안내서 (준비중)">
						<img data-icon="library" alt="" aria-hidden="true" />
						<span class="nav-text">정책 안내서</span>
						<span class="nav-badge-soon">준비중</span>
					</button>
				</div>
				<div class="nav-group">
					<button type="button" class="nav-link" data-page="chatbot"
						data-modal-open="preparingServiceModal"
						aria-label="AI-ONE 챗봇 (준비중)" title="AI-ONE 챗봇 (준비중)">
						<img data-icon="chat" alt="" aria-hidden="true" />
						<span class="nav-text">AI-ONE 챗봇</span>
						<span class="nav-badge-soon">준비중</span>
					</button>
				</div>
			</nav>

			<div class="sidebar-footer">
				<div class="user-card">
					<button type="button" class="user-avatar" data-sidebar-account-toggle aria-label="사용자 메뉴"
						title="사용자 메뉴" aria-haspopup="menu" aria-expanded="false"
						aria-controls="sidebarAccountMenu">
						<img class="icon icon-primary" data-icon="user" alt="" aria-hidden="true" />
					</button>
					<div class="user-info"><span class="user-name">박재정 담당자</span><span class="user-dept">재정분석과</span></div>
					<button type="button" class="icon-button icon-button-ghost settings-btn" id="settingsBtn"
						aria-label="환경설정" title="환경설정" data-sidebar-account-toggle aria-haspopup="menu"
						aria-expanded="false" aria-controls="sidebarAccountMenu">
						<img class="icon icon-small" data-icon="settings-alt" alt="" aria-hidden="true" />
					</button>
					<div class="user-account-menu" id="sidebarAccountMenu" role="menu" aria-label="사용자 계정 메뉴" hidden>
						<div class="user-account-summary">
							<strong>박재정 주무관</strong>
							<span>재정분석과</span>
						</div>
						<button type="button" role="menuitem" data-sidebar-account-action="profile">
							<img data-icon="user" alt="" aria-hidden="true" />
							<span>내 정보</span>
						</button>
						<button type="button" role="menuitem" data-sidebar-account-action="settings">
							<img data-icon="settings-alt" alt="" aria-hidden="true" />
							<span>환경설정</span>
						</button>
						<button type="button" class="danger" role="menuitem" data-sidebar-account-action="logout"
							data-modal-open="sidebarLogoutModal">
							<img data-icon="logout" alt="" aria-hidden="true" />
							<span>로그아웃</span>
						</button>
					</div>
				</div>
			</div>

			<div data-component-include="modal" data-component-id="preparingServiceModal"
				data-component-variant="alert" data-component-label="준비중 안내">
				<template data-slot="title">준비중</template>
				<template data-slot="description">이 화면은 프로토타입에 아직 포함되어 있지 않습니다.</template>
				<template data-slot="actions">
					<button type="button" class="btn-confirm" data-modal-close>확인</button>
				</template>
			</div>

			<div data-component-include="modal" data-component-id="sidebarLogoutModal"
				data-component-variant="logout" data-component-label="로그아웃 확인">
				<template data-slot="title">로그아웃</template>
				<template data-slot="description">AI-ONE에서 로그아웃하시겠습니까?</template>
				<template data-slot="actions">
					<button type="button" class="btn-cancel" data-modal-close>취소</button>
					<button type="button" class="btn-confirm danger" data-sidebar-logout-confirm
						data-modal-close>로그아웃</button>
				</template>
			</div>
			</aside>
	</template>

	<template data-component-file-fallback="datatable">
		<section class="data-table-container" data-component="datatable"
			style="--data-table-max-width: {{maxWidth}}; --data-table-max-height: {{maxHeight}};">
			<header class="data-table-header">
				<h2 class="data-table-title" data-slot="title">최근 사용 이력</h2>
				<a class="data-table-more" href="#" data-slot="more">전체 이력 보기 ›</a>
			</header>
			<div class="data-table-scroll">
				<table class="data-table" data-datatable>
					<caption data-slot="caption">최근 사용 이력</caption>
					<thead>
						<tr>
							<th class="data-table-col-service" scope="col">서비스명</th>
							<th class="data-table-col-type" scope="col">유형</th>
							<th class="data-table-col-task" scope="col">최근 작업명</th>
							<th class="data-table-col-updated" scope="col">최근 이용일</th>
							<th class="data-table-col-status" scope="col">상태</th>
							<th class="data-table-col-created" scope="col">등록일</th>
							<th class="data-table-col-actions" scope="col"><span class="sr-only">작업</span></th>
						</tr>
					</thead>
					<tbody data-slot="rows">
						<tr>
							<td><span class="data-table-service"><span class="data-table-service-name">국회 답변서 초안 작성</span></span></td>
							<td>AI초안</td>
							<td>청년 고용 정책 관련 답변 초안</td>
							<td>2026.05.20 10:24</td>
							<td><span class="data-table-status">완료</span></td>
							<td>2026.05.19</td>
							<td class="data-table-actions">⋮</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</template>

	<template data-component-file-fallback="toast">
		<div class="ai-one-toast" id="{{id}}" data-component="toast" data-toast
			role="status" aria-live="polite" aria-atomic="true" hidden>
			<span class="ai-one-toast-message" data-toast-message data-slot="message"></span>
		</div>
	</template>

	<template data-component-file-fallback="modal">
		<div class="custom-modal-backdrop{{backdropClass}}" id="{{id}}" data-component="modal" data-modal hidden>
			<section class="custom-modal modal-{{size}} modal-variant-{{variant}}" role="dialog" aria-modal="true"
				data-modal-variant="{{variant}}" aria-label="{{label}}">
				<div class="modal-variant-panel" data-modal-panel="action-menu">
					<div class="modal-action-menu" role="menu">
						<button type="button" class="modal-action-item" role="menuitem" data-modal-close>
							<svg viewBox="0 0 24 24" aria-hidden="true">
								<circle cx="18" cy="5" r="3" />
								<circle cx="6" cy="12" r="3" />
								<circle cx="18" cy="19" r="3" />
								<line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
								<line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
							</svg>
							대화 공유
						</button>
						<button type="button" class="modal-action-item" role="menuitem" data-modal-close>
							<svg viewBox="0 0 24 24" aria-hidden="true">
								<path d="M12 2v20M12 2 8 6M12 2l4 4" />
							</svg>
							고정
						</button>
						<button type="button" class="modal-action-item" role="menuitem" data-modal-close>
							<svg viewBox="0 0 24 24" aria-hidden="true">
								<path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" />
							</svg>
							이름 변경
						</button>
						<button type="button" class="modal-action-item danger" role="menuitem" data-modal-close>
							<svg viewBox="0 0 24 24" aria-hidden="true">
								<polyline points="3 6 5 6 21 6" />
								<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
							</svg>
							삭제
						</button>
					</div>
				</div>

				<div class="modal-variant-panel" data-modal-panel="content">
					<div class="custom-modal-icon danger" data-modal-icon="default" aria-hidden="true">⚠</div>
					<div class="custom-modal-icon confirm" data-modal-icon="question" aria-hidden="true">
						<svg viewBox="0 0 24 24">
							<path d="M4 11.5 12 4l8 7.5" />
							<path d="M6 10.5V19h12v-8.5" />
							<path d="M9 13h6" />
							<path d="M12 10v6" />
						</svg>
					</div>
					<div class="custom-modal-icon alert" data-modal-icon="alert" aria-hidden="true">!</div>
					<div class="custom-modal-icon logout" data-modal-icon="logout" aria-hidden="true">
						<img src="../../assets/icons/logout.svg" alt="" />
					</div>
					<div class="custom-modal-title" id="{{id}}-title" data-slot="title">작업을 삭제할까요?</div>
					<div class="custom-modal-msg" id="{{id}}-description" data-slot="description">
						삭제한 작업은 다시 복구할 수 없습니다.
					</div>
					<div class="custom-modal-actions" data-slot="actions">
						<button type="button" class="btn-cancel" data-modal-close>취소</button>
						<button type="button" class="btn-confirm danger">삭제</button>
					</div>
				</div>
			</section>
		</div>
	</template>

	<script src="../component/component-include-loader.js?v=20260731-7"></script>
	<script src="../component/service-card/service-card.js?v=20260731-3"></script>
	<script src="../js/common.js?v=20260731-2"></script>
	<script src="../js/ai-home-page.js?v=20260731-3"></script>
</body>
</html>
