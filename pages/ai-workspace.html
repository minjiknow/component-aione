										<button type="button" class="button button-outline" data-question-move="-1" disabled>‹ 이전</button>
										<button type="button" class="button button-outline" data-question-move="1">다음 ›</button>
									</div>
								</aside>
							</div>

							<footer class="comparison-footer">
								<div>글자 수: <strong data-character-count>293</strong><span class="footer-divider"></span>페이지 <strong data-page-count>1/1</strong></div>
								<div class="zoom-control" aria-label="문서 확대 축소">
									<button type="button" class="icon-button icon-button-sm" aria-label="축소">−</button>
									<strong>100%</strong>
									<button type="button" class="icon-button icon-button-sm" aria-label="확대">+</button>
									<button type="button" class="icon-button icon-button-sm" aria-label="맞춤 보기"><img class="icon icon-small" data-icon="fullscreen-expand" alt="" aria-hidden="true" /></button>
								</div>
							</footer>
						</template>
					</div>
				</template>
			</div>
		</div>

		<div data-component-include="modal"
			data-component-id="workspaceQuestionConfirmModal"
			data-component-variant="confirm"
			data-component-label="질의 확정 확인">
			<template data-slot="title">질의 확정</template>
			<template data-slot="description">질의 및 실국을 확정하시겠습니까?</template>
			<template data-slot="actions">
				<button type="button" class="btn-cancel" data-modal-close>취소</button>
				<button type="button" class="btn-confirm"
					data-workspace-confirm="question-classification" data-modal-close>확인</button>
			</template>
		</div>

		<div data-component-include="modal"
			data-component-id="workspaceDepartmentNotificationModal"
			data-component-variant="confirm"
			data-component-label="실국 알림 전송 확인">
			<template data-slot="title">알림 전송</template>
			<template data-slot="description">실국담당자에게 알림을 전송하시겠습니까?</template>
			<template data-slot="actions">
				<button type="button" class="btn-cancel" data-modal-close>취소</button>
				<button type="button" class="btn-confirm"
					data-workspace-confirm="department-notification" data-modal-close>확인</button>
			</template>
		</div>

		<div data-component-include="modal"
			data-component-id="preparingServiceModal"
			data-component-variant="alert"
			data-component-label="준비중 안내">
			<template data-slot="title">준비중</template>
			<template data-slot="description">이 화면은 프로토타입에 아직 포함되어 있지 않습니다.</template>
			<template data-slot="actions">
				<button type="button" class="btn-confirm" data-modal-close>확인</button>
			</template>
		</div>

		<div data-component-include="modal"
			data-component-id="workspaceFileDeleteModal"
			data-component-label="파일 삭제 확인">
			<template data-slot="title">파일 삭제</template>
			<template data-slot="description">
				<strong class="workspace-delete-file-name" data-delete-file-name></strong><br />
				질의 업로드 목록에서 삭제하시겠습니까?
			</template>
			<template data-slot="actions">
				<button type="button" class="btn-cancel" data-modal-close>취소</button>
				<button type="button" class="btn-confirm danger"
					data-workspace-confirm="delete-file" data-modal-close>삭제</button>
			</template>
		</div>

		<div data-component-include="toast" data-component-id="workspaceToast">
			<template data-slot="message">작업이 완료되었습니다.</template>
		</div>
	</div>
</body>
</html>
