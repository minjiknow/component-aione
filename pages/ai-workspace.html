			<template data-slot="body">
					<div class="rule-drawer-left">
						<div class="rule-list" aria-label="분류 룰 목록">
							<div class="rule-item active">

								</div>
							</div>
							<div class="form-group">

							<div class="form-row">

									<label for="workspaceRuleCondition">조건 방식</label>
									<select id="workspaceRuleCondition" class="form-select">

										<option>모두 포함</option>
										<option>정확히 일치</option>

								</div>
								<div class="form-group flex1">
									<label for="workspaceRuleScope">적용 범위</label>
									<select id="workspaceRuleScope" class="form-select">
										<option>현재 실행 건</option>
										<option>전체 적용</option>
									</select>
								</div>
							</div>
						</section>

						<section class="rule-detail-section">
							<h3 class="rule-detail-title">AI 충돌 시 처리</h3>
							<div class="form-group">
								<label class="radio-label">

									<input type="radio" name="workspaceRuleConflict" value="both" />

							</div>
						</section>

						<section class="rule-detail-section">
							<h3 class="rule-detail-title">설명 및 운영 메모</h3>
							<textarea class="form-textarea" rows="4"
								placeholder="세목, 세액공제, 조세감면 등 세제 관련 키워드가 포함된 질의는 세제실로 우선 보정합니다."></textarea>
						</section>
				</div>
			</template>
			<template data-slot="footer">
				<span class="rule-drawer-hint">
					저장 후 '룰 적용 재실행'을 누르면 결과 목록에 반영됩니다.
				</span>
				<button type="button" class="button button-ghost" data-rule-action="add">+ 룰 추가</button>
				<button type="button" class="button button-primary" data-rule-action="save">저장</button>
				<button type="button" class="button button-dark" data-rule-action="apply">
					↻ 룰 적용 재실행
