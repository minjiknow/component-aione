<!DOCTYPE html>
<html lang="ko" class="control-preview-root">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Radio 컴포넌트</title>
	<link rel="icon" href="../../assets/icons/ai-one-logo.svg" type="image/svg+xml" />
	<link rel="stylesheet" href="../../css/common.css" />
	<link rel="stylesheet" href="../_preview/component-preview.css" />
</head>
<body class="control-preview-page">
	<main class="control-preview">
		<header class="control-preview-header">
			<div>
				<h1 class="control-preview-title">Radio</h1>
				<p class="control-preview-desc">브라우저 기본 라디오를 사용하며 같은 name을 가진 항목 중 하나만 선택합니다.</p>
			</div>
			<a class="control-preview-back" href="../index.html#forms">컴포넌트 목록</a>
		</header>

		<section class="control-preview-section" aria-labelledby="radio-states-title">
			<h2 class="control-preview-section-title" id="radio-states-title">상태</h2>
			<div class="control-use-list">
				<article class="control-use-case"><span class="control-use-label">Default</span><label class="radio-label"><input type="radio" name="radio-default" /><span class="choice-title">선택 안 함</span></label></article>
				<article class="control-use-case"><span class="control-use-label">Checked</span><label class="radio-label"><input type="radio" name="radio-checked" checked /><span class="choice-title">선택됨</span></label></article>
				<article class="control-use-case"><span class="control-use-label">Disabled</span><label class="radio-label"><input type="radio" name="radio-disabled" disabled /><span class="choice-title">선택 불가</span></label></article>
				<article class="control-use-case"><span class="control-use-label">Checked + Disabled</span><label class="radio-label"><input type="radio" name="radio-checked-disabled" checked disabled /><span class="choice-title">선택 상태로 잠김</span></label></article>
			</div>
		</section>

		<section class="control-preview-section" aria-labelledby="radio-group-title">
			<h2 class="control-preview-section-title" id="radio-group-title">그룹</h2>
			<fieldset class="choice-group">
				<legend class="choice-group-label">처리 방식</legend>
				<div class="choice-list choice-list-inline">
					<label class="radio-label"><input type="radio" name="processingMode" value="automatic" checked /><span class="choice-title">자동 처리</span></label>
					<label class="radio-label"><input type="radio" name="processingMode" value="manual" /><span class="choice-title">수동 검토</span></label>
				</div>
			</fieldset>
		</section>
	</main>
</body>
</html>
